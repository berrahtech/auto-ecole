<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="640" height="500">
  <title>Le Berrah — Logo vertical (enseigne, affiche, attestation)</title>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,700;1,800&amp;display=swap');
      .w{font-family:'Plus Jakarta Sans','Montserrat',Arial,sans-serif}</style>
    <linearGradient id="gNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4570"/>
      <stop offset="1" stop-color="#0a1622"/>
    </linearGradient>
    <linearGradient id="gGoldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d98a00"/>
      <stop offset=".5" stop-color="#ffcf3a"/>
      <stop offset="1" stop-color="#f5b301"/>
    </linearGradient>
    <clipPath id="tile"><rect width="120" height="120" rx="28"/></clipPath>
  </defs>
  <g transform="translate(115 0) scale(.75)" clip-path="url(#tile)">
    <rect width="120" height="120" rx="28" fill="url(#gNavy)"/>
    <text class="w" x="58" y="72" text-anchor="middle" font-size="74" font-weight="800" font-style="italic" fill="#ffffff">B</text>
    <path d="M0 102 C 40 101, 80 94, 120 70 L120 68.5 C 80 88, 40 92, 0 91 Z" fill="url(#gGoldH)"/>
    <path d="M0 96.5 C 40 96, 80 91, 120 69.3" fill="none" stroke="#0d1b2a" stroke-width="1.3" stroke-dasharray="6 4.5"/>
  </g>
  <g transform="translate(0 112)">
    <text class="w" x="4" y="58" font-size="52" font-weight="800" font-style="italic" letter-spacing="-1.5" fill="#0d1b2a">LE BERRAH</text>
    <path d="M0 108 C 110 107, 220 96, 318 64 L316 63.8 C 218 89, 108 93, 0 91 Z" fill="url(#gGoldH)"/>
    <path d="M0 99.5 C 110 99, 219 92.5, 317 63.9" fill="none" stroke="#0d1b2a" stroke-width="1.5" stroke-dasharray="10 7"/>
    <text class="w" x="5" y="127" font-size="11.5" font-weight="700" letter-spacing="6.5" fill="#e09600">AUTO-ÉCOLE · BAMAKO</text>
  </g>
</svg>
